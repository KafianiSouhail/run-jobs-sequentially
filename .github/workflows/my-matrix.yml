name: Matrix Workflow
on:
    push:
        branches:
            - master
jobs:
    build:
        strategy:
            matrix:
                node-version: [10, 18, 20]
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                node-version: ${{matrix.node-version}}
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build