name: Environment Variables
on: 
  push:
    branches:
      - master
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install node js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Linting
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install node js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Install dependencies
        id: cahe-node-modules
        uses: actions/cache@V4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/package-lock') }}
        
      - name: Install dependencies
        if: steps.cahe-node-modules.outputs.cache-hit != 'true'  
        run: npm ci
      - name: Tetsting
        id: run-tests  
        run: npm run test
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'  
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Print Building
        run: echo "Building"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Print Deploying
        run: echo "Deploying"
  report:
    runs-on: ubuntu-latest
    needs: [lint, deploy]
    if: failure()
    steps:
      - name: Generate Report
        run: echo "Generating Report"