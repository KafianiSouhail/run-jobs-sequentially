name: Environment Variables
on: 
  push:
    branches:
      - master
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install node js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Linting
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install node js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Tetsting
        run: npm run test
      - name: Upload test report
        uses: actions/upload-artifact@v2
        with:
          name: test-report
          path: test-results.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Print Building
        run: echo "Building"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Print Deploying
        run: echo "Deploying"